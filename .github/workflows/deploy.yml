name: Publish Cecil-IA Labs portal

# Manual deployment: prevents runs on every push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate catalog
        run: node --test tests/site.test.mjs
      - name: Stage static site
        run: |
          mkdir -p _site/assets _site/data _site/scripts
          cp index.html 404.html styles.css robots.txt sitemap.xml .nojekyll _site/
          # Keep Google Search Console verification files available at the site root.
          for verification_file in google*.html; do
            if [ -f "$verification_file" ]; then
              cp "$verification_file" _site/
            fi
          done
          cp assets/favicon.svg _site/assets/
          cp data/projects.json _site/data/
          cp scripts/app.js _site/scripts/
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
