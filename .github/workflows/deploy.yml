name: Publish Cecil-IA Labs portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog
        run: node --test tests/site.test.mjs
      - name: Stage static site
        run: |
          mkdir -p _site/assets _site/data _site/scripts
          cp index.html 404.html styles.css robots.txt sitemap.xml .nojekyll _site/
          cp assets/favicon.svg _site/assets/
          cp data/projects.json _site/data/
          cp scripts/app.js _site/scripts/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
